<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5a35"/>
      <stop offset="55%" stop-color="#17834f"/>
      <stop offset="100%" stop-color="#1f9d5c"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="-40" cy="280" r="160" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="1080" cy="-20" r="140" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="920" cy="260" r="90" fill="#ffffff" fill-opacity="0.06"/>
  <!-- abstract headline cards -->
  <g transform="translate(80 70)">
    <rect width="280" height="180" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="24" y="28" width="160" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="24" y="56" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="24" y="76" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="24" y="96" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="48" cy="148" r="14" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="74" y="140" width="90" height="16" rx="8" fill="#ffffff" fill-opacity="0.4"/>
  </g>
  <g transform="translate(400 90)">
    <rect width="240" height="150" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="22" y="26" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="22" y="52" width="180" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="22" y="70" width="160" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="22" y="88" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22"/>
  </g>
  <!-- broadcast / signal motif -->
  <g transform="translate(760 80)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <path d="M40 140c40-50 100-50 140 0"/>
    <path d="M70 110c25-30 65-30 90 0"/>
    <path d="M100 82c12-14 28-14 40 0"/>
    <circle cx="120" cy="155" r="10" fill="#ffffff" stroke="none" opacity="0.9"/>
  </g>
  <!-- SkillPost mark hint -->
  <g transform="translate(980 120)">
    <rect width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M30 55 L55 30 L80 55 L105 30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
</svg>
